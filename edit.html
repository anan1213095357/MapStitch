<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>MapStitch 4K 无缝地图编辑器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #151515; color: #eee; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        canvas { display: block; cursor: crosshair; }
        
        /* ---------------- 工具栏专业版 UI ---------------- */
        #toolbar {
            position: absolute; top: 0; left: 0; right: 0; background: #1e1e1e; 
            border-bottom: 1px solid #333; padding: 10px 20px; 
            display: flex; flex-direction: column; gap: 12px; z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6); font-size: 13px;
        }
        
        .toolbar-row { display: flex; width: 100%; align-items: center; gap: 20px; flex-wrap: wrap; }
        
        .btn-group { 
            display: flex; align-items: center; gap: 8px; 
            background: #252526; padding: 6px 12px; border-radius: 6px; 
            border: 1px solid #3a3a3a;
        }
        
        .group-label { color: #aaa; font-weight: 600; margin-right: 4px; font-size: 12px; user-select: none; }
        .separator { width: 1px; height: 18px; background: #444; margin: 0 4px; }
        
        button { 
            padding: 6px 14px; background: #3a3d41; color: #e0e0e0; 
            border: 1px solid #555; border-radius: 4px; cursor: pointer; 
            transition: all 0.2s ease; white-space: nowrap; font-size: 13px;
        }
        button:hover:not(:disabled) { background: #505357; color: #fff; border-color: #777; }
        button:disabled { opacity: 0.4; cursor: not-allowed; border-color: #333; }
        
        /* 功能按钮主题色 */
        .btn-primary { background: #007acc; border-color: #007acc; color: white; font-weight: 600; }
        .btn-primary:hover:not(:disabled) { background: #005f9e; }
        
        .btn-success { background: #2e7d32; border-color: #2e7d32; color: white; }
        .btn-success:hover:not(:disabled) { background: #1b5e20; }
        
        .btn-danger { background: #c62828; border-color: #c62828; color: white; }
        .btn-danger:hover:not(:disabled) { background: #b71c1c; }
        
        .btn-highlight { background: #00695c; border-color: #00695c; color: white; font-weight: bold; }
        .btn-highlight:hover:not(:disabled) { background: #004d40; box-shadow: 0 0 10px rgba(0,105,92,0.6); }

        .btn-export { background: #6a1b9a; border-color: #6a1b9a; color: white; font-weight: bold; }
        .btn-export:hover:not(:disabled) { background: #4a148c; }
        
        /* 状态按钮的激活态 */
        button.active[data-mode="expand"] { background: #4caf50; border-color: #4caf50; font-weight: bold; color: black;}
        button.active[data-mode="cut"] { background: #ff4081; border-color: #ff4081; font-weight: bold; box-shadow: 0 0 8px rgba(255,64,129,0.5);}
        button.active[data-mode="merge"] { background: #00e676; border-color: #00e676; font-weight: bold; color: black; box-shadow: 0 0 8px rgba(0,230,118,0.5);}
        button.active[data-mode="col"] { background: #d32f2f; border-color: #d32f2f; font-weight: bold; color: white;}
        button.active[data-mode="occ"] { background: #1976d2; border-color: #1976d2; font-weight: bold; color: white;}
        button.active[data-mode="fg"] { background: #fbc02d; border-color: #fbc02d; font-weight: bold; color: black;}
        
        select { background: #333; color: white; border: 1px solid #555; padding: 6px; border-radius: 4px; cursor: pointer; outline: none; font-size: 13px;}
        input[type="text"] { background: #1e1e1e; color: #fff; border: 1px solid #555; padding: 6px 8px; border-radius: 4px; outline: none; font-size: 13px;}
        input[type="text"]:focus { border-color: #007acc; }
        
        /* Checkbox 样式 */
        input[type="checkbox"] { accent-color: #00e676; width: 16px; height: 16px; cursor: pointer;}
        
        #debug-img { position: absolute; bottom: 10px; left: 10px; border: 2px solid #4caf50; background: #000; max-height: 150px; display: none; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.5);}
        #status-bar { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.85); padding: 8px 15px; border-radius: 6px; font-size: 13px; color: #00ffcc; pointer-events: none; z-index: 10; font-weight: 600; border: 1px solid #333;}
    </style>
</head>
<body>

<div id="toolbar">
    <!-- 第一排：核心工程与文件 -->
    <div class="toolbar-row">
        <!-- 逻辑更清晰的工程模块 -->
        <div class="btn-group">
            <span class="group-label">📁 本地工程</span>
            <select id="project-list" style="width: 130px;" title="选择本地已保存的项目"></select>
            <button onclick="loadSelectedProject()">📂 读取地图</button>
            <button onclick="deleteSelectedProject()" class="btn-danger">🗑️ 删除</button>
            
            <div class="separator"></div>
            
            <input type="text" id="project-name" value="新地图" style="width: 100px;" title="项目名称" placeholder="输入项目名称">
            <button onclick="saveCurrentProject()" class="btn-primary">💾 保存 / 另存</button>
        </div>

        <!-- 基础地图图层管理组合 -->
        <div class="btn-group">
            <span class="group-label">🌍 基础地图层</span>
            <button onclick="triggerUploadBg()" class="btn-success">➕ 选定首图 (4K)</button>
            <button id="btn-replace" onclick="triggerReplace()" disabled title="替换当前选中网格的底图">🔄 替换当前选中图</button>
        </div>
        
        <!-- 建筑实体图层管理独立 -->
        <div class="btn-group">
            <span class="group-label">✨ 建筑实体层</span>
            <button id="btn-add-buildings" onclick="document.getElementById('upload-building-img').click()" class="btn-highlight" disabled>🔮 智能提取实体孤岛</button>
        </div>
        
        <div class="btn-group" style="margin-left: auto; background: transparent; border: none;">
            <button id="btn-export" onclick="exportGodotZip()" class="btn-export">📦 导出 Godot ZIP 引擎包</button>
        </div>
    </div>
    
    <!-- 第二排：操作模式与笔刷工具 -->
    <div class="toolbar-row">
        <!-- 基础操作 -->
        <div class="btn-group">
            <span class="group-label">👆 基础交互</span>
            <button class="mode-btn active" data-mode="expand" onclick="setMode('expand')">🖐️ 漫游 / 选中扩图</button>
        </div>

        <!-- 实体编辑 -->
        <div class="btn-group">
            <span class="group-label">✂️ 实体修剪</span>
            <button class="mode-btn" data-mode="cut" onclick="setMode('cut')" title="目标区域将被提取为红色孤岛">✂️ 变红 (剔除)</button>
            <button class="mode-btn" data-mode="merge" onclick="setMode('merge')" title="目标区域将被提取打包为绿色孤岛">🔗 变绿 (合并保留)</button>
            <div class="separator"></div>
            <label style="color:#aaa; font-size:12px; display:flex; align-items:center; gap:4px; cursor:pointer;" title="开启后：变绿模式下，只要框碰到一点绿岛，就会把整个绿岛吸附进去合并；而红色部分仍然只做精准的像素切割。">
                <input type="checkbox" id="opt-smart-merge" checked> 绿岛整体吸附
            </label>
        </div>

        <!-- 游戏逻辑涂鸦 -->
        <div class="btn-group">
            <span class="group-label">🛑 逻辑区域设定</span>
            <button class="mode-btn" data-mode="col" onclick="setMode('col')">🟥 画禁足区</button>
            <button class="mode-btn" data-mode="occ" onclick="setMode('occ')">🟦 画遮挡区</button>
            <button class="mode-btn" data-mode="fg" onclick="setMode('fg')">🟨 画前景区</button>
        </div>
        
        <!-- 辅助笔刷 -->
        <div class="btn-group">
            <span class="group-label">📐 笔刷形状</span>
            <select id="shape-select" onchange="shapeTool = this.value">
                <option value="click">🖱️ 点选变色 (一键转换孤岛红/绿状态)</option>
                <option value="poly">📌 多边形套索 (首尾闭合生效)</option>
                <option value="rect">🔲 矩形套索 (鼠标拖拽松开生效)</option>
                <option value="freeline">〰️ 物理划线刀 (拖拽划线切割孤岛)</option>
            </select>
            <button onclick="undoShape()">↩️ 撤销上一步</button>
        </div>
    </div>
</div>

<!-- 隐藏的文件上传组件 -->
<input type="file" id="upload-img" style="display:none;" accept="image/png, image/jpeg">
<input type="file" id="replace-chunk-img" style="display:none;" accept="image/png, image/jpeg">
<input type="file" id="upload-chunk-img" style="display:none;" accept="image/png, image/jpeg">
<input type="file" id="upload-building-img" style="display:none;" accept="image/png, image/jpeg">

<img id="debug-img" title="发给AI的边缘参考图">
<div id="status-bar">正在加载数据库...</div>
<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', () => { resizeCanvas(); draw(); });
    resizeCanvas();

    const CHUNK_SIZE = 4096; 
    const EDGE_WIDTH = 512;  
    const STRIDE = CHUNK_SIZE - EDGE_WIDTH; 

    let scale = 0.15;
    let cameraX = window.innerWidth / 2 - (CHUNK_SIZE * scale) / 2;
    let cameraY = window.innerHeight / 2 - (CHUNK_SIZE * scale) / 2;
    
    let mode = 'expand'; 
    let shapeTool = 'click'; 
    let selectedChunkKey = null; 
    let targetUploadChunk = null; 
    
    let chunks = {}; 
    let availableSlots = {}; 
    let globalShapes = { col: [], occ: [], fg: [] };

    let isDragging = false, lastX = 0, lastY = 0; 
    let currentPoly = [], mouseWorldPos = {x: 0, y: 0}, isDrawingRect = false; 
    let rectStart = null, rectCurrent = null, hoveredBuilding = null; 
    
    let isDrawingFreehand = false, freehandPts = [];

    let hoveredPolygon = null; 
    let isHoveringDeleteBtn = false;

    const colors = {
        'col': { stroke: 'red', fill: 'rgba(255, 0, 0, 0.3)' },
        'occ': { stroke: '#00aaff', fill: 'rgba(0, 150, 255, 0.3)' },
        'fg': { stroke: 'yellow', fill: 'rgba(255, 255, 0, 0.3)' },
        'cut': { stroke: '#ff4081', fill: 'rgba(255, 64, 129, 0.3)' },
        'merge': { stroke: '#00e676', fill: 'rgba(0, 230, 118, 0.3)' }
    };

    function fallbackCopy(text) {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = 0;
        document.body.appendChild(textarea);
        textarea.select();
        try { document.execCommand("copy"); } catch(e) {}
        document.body.removeChild(textarea);
    }

    function triggerUploadBg() {
        const txt = "生成一个 顶视图，开放像素宽高4096的地图，仙侠世界类型的。城镇图。要 像素画风的。高清大图。不要边框不要任何说明文字。只生成图片本身。要高清大图。 不要显示任何人，不要显示任何天空和云朵。建筑物不要太密集 不要太小。";
        fallbackCopy(txt);
        prompt("【首图生成提示词】已尝试复制！\n如果剪贴板没生效，请手动复制下方内容发给AI：", txt);
        document.getElementById('upload-img').click();
    }

    const dbName = "AI4KMapEditorDB";
    const storeName = "projects";
    let db;

    function initDB() {
        return new Promise((resolve, reject) => {
            let request = indexedDB.open(dbName, 1);
            request.onupgradeneeded = function(e) {
                db = e.target.result;
                if (!db.objectStoreNames.contains(storeName)) { db.createObjectStore(storeName, { keyPath: "name" }); }
            };
            request.onsuccess = function(e) { db = e.target.result; resolve(); };
            request.onerror = function(e) { reject(e); };
        });
    }

    window.onload = () => {
        initDB().then(() => {
            updateProjectList();
            setStatus("就绪 | 悬浮物理区可单删 | 右键漫游 | 滚轮无极缩放");
        }).catch(e => {
            console.error(e);
            setStatus("本地数据库初始化失败，保存功能可能不可用。");
        });
    };

    function updateProjectList() {
        const transaction = db.transaction([storeName], "readonly");
        const store = transaction.objectStore(storeName);
        const request = store.getAllKeys();
        request.onsuccess = (e) => {
            const select = document.getElementById('project-list');
            select.innerHTML = '';
            e.target.result.forEach(key => {
                const opt = document.createElement('option'); opt.value = key; opt.innerText = key;
                select.appendChild(opt);
            });
        };
    }

    async function saveCurrentProject() {
        const pName = document.getElementById('project-name').value.trim();
        if(!pName) return alert('请输入项目名称！');
        
        setStatus("正在极速保存项目到本地缓存...");
        const data = { name: pName, timestamp: Date.now(), cameraX, cameraY, scale, globalShapes, chunks: {} };
        
        for(let key in chunks) {
            let c = chunks[key]; let sc = { ...c };
            delete sc.fullImage; delete sc.croppedImage;
            if (c.buildings) {
                sc.buildings = c.buildings.map(b => {
                    let sb = { ...b };
                    delete sb.image; delete sb.outlineImage;
                    return sb;
                });
            }
            data.chunks[key] = sc;
        }

        const transaction = db.transaction([storeName], "readwrite");
        const store = transaction.objectStore(storeName); store.put(data);
        transaction.oncomplete = () => { setStatus(`项目 [${pName}] 保存成功！`); updateProjectList(); };
    }

    async function loadSelectedProject() {
        const select = document.getElementById('project-list'); const pName = select.value;
        if(!pName) return;
        
        setStatus(`正在读取项目 [${pName}]，正在重建内存图集...`);
        const transaction = db.transaction([storeName], "readonly");
        const store = transaction.objectStore(storeName); const request = store.get(pName);
        
        request.onsuccess = async (e) => {
            const data = e.target.result; if(!data) return;
            cameraX = data.cameraX; cameraY = data.cameraY; scale = data.scale;
            globalShapes = data.globalShapes; document.getElementById('project-name').value = data.name;
            
            chunks = {};
            for(let key in data.chunks) {
                let sc = data.chunks[key];
                if(sc.isPending) { chunks[key] = sc; continue; }
                
                await new Promise((resolve) => {
                    let loaded = 0, total = 2; 
                    if(sc.buildings) total += sc.buildings.length * 2;
                    const check = () => { loaded++; if(loaded === total) resolve(); };
                    
                    sc.fullImage = new Image(); sc.fullImage.onload = check; sc.fullImage.src = sc.fullDataURL;
                    sc.croppedImage = new Image(); sc.croppedImage.onload = check; sc.croppedImage.src = sc.dataURL;
                    
                    if(sc.buildings) {
                        sc.buildings.forEach(b => {
                            b.image = new Image(); b.image.onload = check; b.image.src = b.dataURL;
                            b.outlineImage = new Image(); b.outlineImage.onload = check; b.outlineImage.src = b.outlineDataURL;
                            if (!b.islandType) b.islandType = 'keep';
                        });
                    }
                });
                chunks[key] = sc;
            }
            selectedChunkKey = null; targetUploadChunk = null; updateUI(); draw();
            setStatus(`项目 [${pName}] 读取成功！已完全恢复。`);
        };
    }

    function deleteSelectedProject() {
        const pName = document.getElementById('project-list').value; if(!pName) return;
        if(!confirm(`确定要永久删除项目 [${pName}] 吗？`)) return;
        const transaction = db.transaction([storeName], "readwrite");
        const store = transaction.objectStore(storeName); store.delete(pName);
        transaction.oncomplete = () => { setStatus(`项目 [${pName}] 已彻底删除。`); updateProjectList(); };
    }

    function getWorldPos(screenX, screenY) { return { x: (screenX - cameraX) / scale, y: (screenY - cameraY) / scale }; }

    function getPolygonCentroid(pts) {
        let cx = 0, cy = 0; for(let i=0; i<pts.length; i++) { cx += pts[i][0]; cy += pts[i][1]; }
        return { x: cx/pts.length, y: cy/pts.length };
    }

    canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomAmount = e.deltaY > 0 ? 0.85 : 1.15; 
        const beforeZoom = getWorldPos(e.clientX, e.clientY);
        scale *= zoomAmount; scale = Math.max(0.01, Math.min(scale, 3.0)); 
        cameraX = e.clientX - beforeZoom.x * scale; cameraY = e.clientY - beforeZoom.y * scale; draw();
    }, { passive: false });

    function undoShape() {
        if (['col', 'occ', 'fg'].includes(mode) && globalShapes[mode].length > 0) {
            globalShapes[mode].pop(); hoveredPolygon = null; draw();
            setStatus(`已撤销一个 ${mode} 区域`);
        }
    }

    window.addEventListener('keydown', (e) => { if (e.ctrlKey && (e.key === 'z' || e.key === 'Z')) undoShape(); });

    function updateAvailableSlots() {
        availableSlots = {};
        for (let key in chunks) {
            const [gx, gy] = key.split('_').map(Number);
            const neighbors = [[gx-1,gy], [gx+1,gy], [gx,gy-1], [gx,gy+1]];
            for (let [nx, ny] of neighbors) {
                const nKey = `${nx}_${ny}`; if (!chunks[nKey]) availableSlots[nKey] = { gx: nx, gy: ny };
            }
        }
    }

    document.getElementById('upload-img').addEventListener('change', function(e) {
        if (!e.target.files[0]) return;
        createChunkImage(e.target.files[0], 0, 0, 0, 0, (fullImg, croppedImg, dataURL, cropW, cropH, fullDataURL) => {
            chunks["0_0"] = { 
                isPending: false, fullImage: fullImg, croppedImage: croppedImg, 
                dataURL: dataURL, fullDataURL: fullDataURL,
                baseX: 0, baseY: 0, drawX: 0, drawY: 0, 
                cropL: 0, cropT: 0, cropW: cropW, cropH: cropH, buildings: [] 
            };
            selectedChunkKey = "0_0"; e.target.value = ''; updateUI(); draw();
        });
    });

    document.getElementById('upload-chunk-img').addEventListener('change', function(e) {
        if (!targetUploadChunk || !e.target.files[0]) return;
        const [gx, gy] = targetUploadChunk.split('_').map(Number);
        const leftN = chunks[`${gx-1}_${gy}`], rightN = chunks[`${gx+1}_${gy}`];
        const topN = chunks[`${gx}_${gy-1}`], bottomN = chunks[`${gx}_${gy+1}`];

        const cropL = (leftN && !leftN.isPending) ? EDGE_WIDTH : 0;
        const cropR = (rightN && !rightN.isPending) ? EDGE_WIDTH : 0;
        const cropT = (topN && !topN.isPending) ? EDGE_WIDTH : 0;
        const cropB = (bottomN && !bottomN.isPending) ? EDGE_WIDTH : 0;

        createChunkImage(e.target.files[0], cropL, cropT, cropR, cropB, (fullImg, croppedImg, dataURL, cropW, cropH, fullDataURL) => {
            chunks[targetUploadChunk] = { 
                isPending: false, fullImage: fullImg, croppedImage: croppedImg, 
                dataURL: dataURL, fullDataURL: fullDataURL,
                baseX: gx * STRIDE, baseY: gy * STRIDE, drawX: gx * STRIDE + cropL, drawY: gy * STRIDE + cropT,
                cropL: cropL, cropT: cropT, cropW: cropW, cropH: cropH, buildings: [] 
            };
            selectedChunkKey = targetUploadChunk; 
            e.target.value = ''; updateUI(); setStatus("已自动裁去重复边缘并完美对接，无缝隙！"); draw();
        });
    });

    function createChunkImage(file, cropL, cropT, cropR, cropB, callback) {
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = () => {
                const fullC = document.createElement('canvas'); fullC.width = fullC.height = CHUNK_SIZE;
                fullC.getContext('2d').drawImage(img, 0, 0, CHUNK_SIZE, CHUNK_SIZE);
                const fullDataURL = fullC.toDataURL('image/jpeg', 0.9);
                
                const cropW = CHUNK_SIZE - cropL - cropR, cropH = CHUNK_SIZE - cropT - cropB;
                const cropC = document.createElement('canvas'); cropC.width = cropW; cropC.height = cropH;
                cropC.getContext('2d').drawImage(fullC, cropL, cropT, cropW, cropH, 0, 0, cropW, cropH);
                
                const croppedDataURL = cropC.toDataURL('image/jpeg', 0.9);
                
                const fullImg = new Image(); 
                const croppedImg = new Image();
                
                let loadedCount = 0;
                const checkFinished = () => {
                    loadedCount++;
                    if (loadedCount === 2) {
                        callback(fullImg, croppedImg, croppedDataURL, cropW, cropH, fullDataURL);
                    }
                };
                
                fullImg.onload = checkFinished;
                croppedImg.onload = checkFinished;
                
                fullImg.src = fullDataURL;
                croppedImg.src = croppedDataURL;
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    function triggerReplace() {
        if (!selectedChunkKey || chunks[selectedChunkKey].isPending) return;
        document.getElementById('replace-chunk-img').click();
    }
    
    document.getElementById('replace-chunk-img').addEventListener('change', function(e) {
        if (!selectedChunkKey || !e.target.files[0]) return;
        const c = chunks[selectedChunkKey];
        createChunkImage(e.target.files[0], c.cropL, c.cropT, CHUNK_SIZE - c.cropL - c.cropW, CHUNK_SIZE - c.cropT - c.cropH, 
        (fullImg, croppedImg, dataURL, cropW, cropH, fullDataURL) => {
            c.fullImage = fullImg; c.croppedImage = croppedImg; 
            c.dataURL = dataURL; c.fullDataURL = fullDataURL;
            e.target.value = ''; draw(); setStatus("背景已替换");
        });
    });

    // 智能连通域提取，支持膨胀愈合（解决碎块）与原样提取
    function extractBlobs(w, h, hitData, dilateAmt = 0) {
        let baseHit = hitData;
        if (dilateAmt > 0) {
            const temp = new Uint8Array(w * h);
            for (let y = 0; y < h; y++) {
                let run = 0;
                for (let x = 0; x < w; x++) { if (hitData[y * w + x]) run = dilateAmt + 1; else if (run > 0) run--; if (run > 0) temp[y * w + x] = 1; }
                run = 0;
                for (let x = w - 1; x >= 0; x--) { if (hitData[y * w + x]) run = dilateAmt + 1; else if (run > 0) run--; if (run > 0) temp[y * w + x] = 1; }
            }
            baseHit = new Uint8Array(w * h);
            for (let x = 0; x < w; x++) {
                let run = 0;
                for (let y = 0; y < h; y++) { if (temp[y * w + x]) run = dilateAmt + 1; else if (run > 0) run--; if (run > 0) baseHit[y * w + x] = 1; }
                run = 0;
                for (let y = h - 1; y >= 0; y--) { if (temp[y * w + x]) run = dilateAmt + 1; else if (run > 0) run--; if (run > 0) baseHit[y * w + x] = 1; }
            }
        }
        
        let visited = new Uint8Array(w * h);
        let blobs = [];
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                let idx = y * w + x;
                // 注意：即使利用膨胀结果寻路，最终也只收入真实有像素的点
                if (baseHit[idx] && !visited[idx] && hitData[idx]) {
                    let q = [idx]; visited[idx] = 1; let head = 0;
                    while(head < q.length) {
                        let curr = q[head++]; let cx = curr % w, cy = Math.floor(curr / w);
                        const neighbors = [curr-1, curr+1, curr-w, curr+w, curr-w-1, curr-w+1, curr+w-1, curr+w+1];
                        for (let n of neighbors) {
                            if (n >= 0 && n < w*h && baseHit[n] && !visited[n]) {
                                let nx = n % w;
                                if (Math.abs(nx - cx) <= 1) {
                                    visited[n] = 1; q.push(n);
                                }
                            }
                        }
                    }
                    
                    let actualPixels = [];
                    let rMinX = w, rMaxX = 0, rMinY = h, rMaxY = 0;
                    for(let i=0; i<q.length; i++) {
                        if (hitData[q[i]]) {
                            actualPixels.push(q[i]);
                            let px = q[i] % w, py = Math.floor(q[i] / w);
                            if (px < rMinX) rMinX = px; if (px > rMaxX) rMaxX = px;
                            if (py < rMinY) rMinY = py; if (py > rMaxY) rMaxY = py;
                        }
                    }
                    if (actualPixels.length > 20) {
                        blobs.push({ minX: rMinX, maxX: rMaxX, minY: rMinY, maxY: rMaxY, pixels: actualPixels });
                    }
                }
            }
        }
        return blobs;
    }

    // 辅助函数：利用孤岛像素对象创建新的建筑实体
    function createBuildingFromBlob(blob, originalImgData, fullW, fullH, islandType, overrideLocalX, overrideLocalY) {
        let pad = 6;
        let rx = Math.max(0, blob.minX - pad), ry = Math.max(0, blob.minY - pad);
        let rw = Math.min(fullW - rx, (blob.maxX - blob.minX) + pad * 2);
        let rh = Math.min(fullH - ry, (blob.maxY - blob.minY) + pad * 2);

        let newCanvas = document.createElement('canvas'); newCanvas.width = rw; newCanvas.height = rh;
        let nCtx = newCanvas.getContext('2d');
        let nImgData = nCtx.createImageData(rw, rh);
        let nHitData = new Uint8Array(rw * rh);

        for (let i = 0; i < blob.pixels.length; i++) {
            let pIdx = blob.pixels[i];
            let px = pIdx % fullW, py = Math.floor(pIdx / fullW);
            let lx = px - rx, ly = py - ry;
            let lIdx = ly * rw + lx;
            nImgData.data[lIdx * 4] = originalImgData.data[pIdx * 4];
            nImgData.data[lIdx * 4 + 1] = originalImgData.data[pIdx * 4 + 1];
            nImgData.data[lIdx * 4 + 2] = originalImgData.data[pIdx * 4 + 2];
            nImgData.data[lIdx * 4 + 3] = originalImgData.data[pIdx * 4 + 3];
            nHitData[lIdx] = 1;
        }
        nCtx.putImageData(nImgData, 0, 0);

        const outlineCanvas = document.createElement('canvas'); outlineCanvas.width = rw; outlineCanvas.height = rh;
        const oCtx = outlineCanvas.getContext('2d'); oCtx.drawImage(newCanvas, 0, 0);
        oCtx.globalCompositeOperation = 'source-in'; 
        oCtx.fillStyle = islandType === 'discard' ? 'rgba(255, 0, 0, 0.9)' : 'rgba(0, 255, 0, 0.9)'; 
        oCtx.fillRect(0, 0, rw, rh);
        
        const outlineImg = new Image(); const bImg = new Image(); 
        let result = {
            localX: overrideLocalX !== null ? overrideLocalX + rx : rx, 
            localY: overrideLocalY !== null ? overrideLocalY + ry : ry, 
            width: rw, height: rh, 
            dataURL: null, image: bImg, outlineDataURL: null, outlineImage: outlineImg, 
            hitData: nHitData, islandType: islandType
        };
        
        bImg.onload = () => { draw(); }; outlineImg.onload = () => { draw(); };
        result.outlineDataURL = outlineCanvas.toDataURL('image/png'); result.dataURL = newCanvas.toDataURL('image/png');
        outlineImg.src = result.outlineDataURL; bImg.src = result.dataURL;

        return result;
    }

    // 第一步上传：智能识别底色 + 形态愈合 + 内部透空
    document.getElementById('upload-building-img').addEventListener('change', function(e) {
        if (!selectedChunkKey || !e.target.files[0]) return;
        const file = e.target.files[0]; 
        setStatus("正在自动分析图像底色，执行智能形态愈合与轮廓提取...");
        
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = () => {
                setTimeout(() => { 
                    const chunk = chunks[selectedChunkKey];
                    chunk.buildings = []; 

                    const canvas4K = document.createElement('canvas'); canvas4K.width = canvas4K.height = CHUNK_SIZE;
                    const ctx4K = canvas4K.getContext('2d', { willReadFrequently: true });
                    ctx4K.drawImage(img, 0, 0, CHUNK_SIZE, CHUNK_SIZE);

                    const cropC = document.createElement('canvas'); cropC.width = chunk.cropW; cropC.height = chunk.cropH;
                    const cropCtx = cropC.getContext('2d', { willReadFrequently: true });
                    cropCtx.drawImage(canvas4K, chunk.cropL, chunk.cropT, chunk.cropW, chunk.cropH, 0, 0, chunk.cropW, chunk.cropH);

                    const imgData = cropCtx.getImageData(0, 0, chunk.cropW, chunk.cropH);
                    const data = imgData.data;
                    const w = chunk.cropW, h = chunk.cropH;

                    let colorCounts = {}, maxCount = 0, bgKey = "0,0,0";
                    for (let i = 0; i < data.length; i += 16) { 
                        let r = Math.round(data[i] / 15) * 15, g = Math.round(data[i+1] / 15) * 15, b = Math.round(data[i+2] / 15) * 15;
                        let key = `${r},${g},${b}`;
                        colorCounts[key] = (colorCounts[key] || 0) + 1;
                        if (colorCounts[key] > maxCount) { maxCount = colorCounts[key]; bgKey = key; }
                    }
                    let [bgR, bgG, bgB] = bgKey.split(',').map(Number);
                    
                    const isSolid = new Uint8Array(w * h);
                    const tol = 55; 
                    for (let i = 0; i < data.length; i += 4) {
                        let dist = Math.hypot(data[i]-bgR, data[i+1]-bgG, data[i+2]-bgB);
                        if (dist > tol && data[i+3] > 20) isSolid[i/4] = 1;
                    }

                    // 初始提取使用膨胀(dilate=3)，防止建筑碎成渣
                    const blobs = extractBlobs(w, h, isSolid, 3);
                    if (blobs.length === 0) { e.target.value = ''; setStatus("未能识别到有效建筑。"); updateUI(); draw(); return; }

                    blobs.forEach(b => {
                        chunk.buildings.push(createBuildingFromBlob(b, imgData, w, h, 'keep', null, null));
                    });
                    
                    const checkAllLoaded = setInterval(() => {
                        let allComplete = chunk.buildings.every(b => b.image.complete && b.outlineImage.complete);
                        if (allComplete) {
                            clearInterval(checkAllLoaded);
                            e.target.value = ''; setStatus(`完美！自动识别底色，连通实体已独立分离为 ${chunk.buildings.length} 个绿色孤岛！`); 
                            updateUI(); draw();
                        }
                    }, 50);

                }, 50);
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file); 
    });

    // ==========================================
    // 💡 混合套索切割：【像素切除】 + 【绿岛整体吸附】
    // ==========================================
    function executeAreaOperation(points, targetIslandType) {
        let processedCount = 0;
        let bbMinX = Math.min(...points.map(p => p[0])), bbMaxX = Math.max(...points.map(p => p[0]));
        let bbMinY = Math.min(...points.map(p => p[1])), bbMaxY = Math.max(...points.map(p => p[1]));
        
        let isSmartMerge = document.getElementById('opt-smart-merge').checked;

        for (let key in chunks) {
            let chunk = chunks[key]; if (chunk.isPending || !chunk.buildings) continue;

            let insidePieces = [];
            
            for (let i = chunk.buildings.length - 1; i >= 0; i--) {
                let b = chunk.buildings[i]; let bGlobalX = chunk.drawX + b.localX, bGlobalY = chunk.drawY + b.localY;
                if (bbMaxX < bGlobalX || bbMinX > bGlobalX + b.width || bbMaxY < bGlobalY || bbMinY > bGlobalY + b.height) continue;

                // 创建选区遮罩
                const maskCanvas = document.createElement('canvas'); maskCanvas.width = b.width; maskCanvas.height = b.height;
                const maskCtx = maskCanvas.getContext('2d');
                maskCtx.beginPath();
                maskCtx.moveTo(points[0][0] - bGlobalX, points[0][1] - bGlobalY);
                for(let k=1; k<points.length; k++) maskCtx.lineTo(points[k][0] - bGlobalX, points[k][1] - bGlobalY);
                maskCtx.closePath(); maskCtx.fill(); 

                // 测试是否发生碰撞
                const inCanvas = document.createElement('canvas'); inCanvas.width = b.width; inCanvas.height = b.height;
                const inCtx = inCanvas.getContext('2d'); inCtx.drawImage(b.image, 0, 0);
                inCtx.globalCompositeOperation = 'destination-in';
                inCtx.drawImage(maskCanvas, 0, 0);

                let inImgData = inCtx.getImageData(0, 0, b.width, b.height);
                let hitAnyIn = false;
                for(let j=0; j<b.width*b.height; j++) { if (inImgData.data[j*4+3] > 20) { hitAnyIn = true; break; } }

                if (!hitAnyIn) continue; // 没有任何像素交集，直接跳过

                chunk.buildings.splice(i, 1); // 有交集，将其从原列表中摘出处理

                // 【核心吸附逻辑】如果是变绿模式，且被碰到的是一个完整的绿岛，并且开启了智能吸附
                if (isSmartMerge && targetIslandType === 'keep' && b.islandType === 'keep') {
                    // 我们不切它！我们把整个绿岛完整的吸附进合并大军里！
                    const fullCanvas = document.createElement('canvas'); fullCanvas.width = b.width; fullCanvas.height = b.height;
                    fullCanvas.getContext('2d').drawImage(b.image, 0, 0);
                    insidePieces.push({ canvas: fullCanvas, globalX: bGlobalX, globalY: bGlobalY, width: b.width, height: b.height });
                } else {
                    // 【常规切割逻辑】切除选区外多余部分，并将框内像素加入处理序列。
                    const outCanvas = document.createElement('canvas'); outCanvas.width = b.width; outCanvas.height = b.height;
                    const outCtx = outCanvas.getContext('2d'); outCtx.drawImage(b.image, 0, 0);
                    outCtx.globalCompositeOperation = 'destination-out';
                    outCtx.drawImage(maskCanvas, 0, 0);

                    let outImgData = outCtx.getImageData(0, 0, b.width, b.height);
                    let outHitData = new Uint8Array(b.width * b.height);
                    let hitAnyOut = false;
                    for(let j=0; j<b.width*b.height; j++) { if (outImgData.data[j*4+3] > 20) { outHitData[j] = 1; hitAnyOut = true; } }

                    // 框外的像素保持原颜色、原状态，裂变重组
                    if (hitAnyOut) {
                        let blobs = extractBlobs(b.width, b.height, outHitData, 0); 
                        blobs.forEach(blob => { chunk.buildings.push(createBuildingFromBlob(blob, outImgData, b.width, b.height, b.islandType, b.localX, b.localY)); });
                    }
                    
                    // 框内的像素加入合并大军！(这实现了切下红色一部分的功能)
                    insidePieces.push({ canvas: inCanvas, globalX: bGlobalX, globalY: bGlobalY, width: b.width, height: b.height });
                }
            }

            // 将所有被网住的像素（或被完整吸附的绿岛）拼合在一起！
            if (insidePieces.length > 0) {
                let minGX = Math.min(...insidePieces.map(p => p.globalX));
                let minGY = Math.min(...insidePieces.map(p => p.globalY));
                let maxGX = Math.max(...insidePieces.map(p => p.globalX + p.width));
                let maxGY = Math.max(...insidePieces.map(p => p.globalY + p.height));
                
                let rw = maxGX - minGX, rh = maxGY - minGY;
                let mergedCanvas = document.createElement('canvas'); mergedCanvas.width = rw; mergedCanvas.height = rh;
                let mergedCtx = mergedCanvas.getContext('2d');
                insidePieces.forEach(p => { mergedCtx.drawImage(p.canvas, p.globalX - minGX, p.globalY - minGY); });
                
                let mImgData = mergedCtx.getImageData(0, 0, rw, rh);
                let realPixels = [];
                for(let j=0; j<rw*rh; j++) {
                    if (mImgData.data[j*4+3] > 20) { realPixels.push(j); }
                }
                
                if (realPixels.length > 0) {
                    let blob = { minX: 0, maxX: rw-1, minY: 0, maxY: rh-1, pixels: realPixels };
                    let localX = minGX - chunk.drawX, localY = minGY - chunk.drawY;
                    chunk.buildings.push(createBuildingFromBlob(blob, mImgData, rw, rh, targetIslandType, localX, localY));
                    processedCount++;
                }
            }
        }
        
        if (processedCount > 0) {
            if (targetIslandType === 'keep') setStatus(`🔗 框选合并生效！已完美融合为【绿色保留孤岛】` + (isSmartMerge ? ` (触发完整绿岛吸附)` : ` (仅切割像素)`));
            else setStatus(`✂️ 框选切除生效！框内像素已切下并独立为【红色剔除孤岛】。`);
        }
    }

    // ==========================================
    // ✂️ 划线刀切除（非闭合线）：一把无情的橡皮擦，物理切断像素分离孤岛
    // ==========================================
    function executeLineCut(points) {
        let slicedCount = 0;
        let bbMinX = Math.min(...points.map(p => p[0])), bbMaxX = Math.max(...points.map(p => p[0]));
        let bbMinY = Math.min(...points.map(p => p[1])), bbMaxY = Math.max(...points.map(p => p[1]));

        for (let key in chunks) {
            let chunk = chunks[key]; if (chunk.isPending || !chunk.buildings) continue;

            for (let i = chunk.buildings.length - 1; i >= 0; i--) {
                let b = chunk.buildings[i]; let bGlobalX = chunk.drawX + b.localX, bGlobalY = chunk.drawY + b.localY;
                if (bbMaxX < bGlobalX || bbMinX > bGlobalX + b.width || bbMaxY < bGlobalY || bbMinY > bGlobalY + b.height) continue;

                const outCanvas = document.createElement('canvas'); outCanvas.width = b.width; outCanvas.height = b.height;
                const outCtx = outCanvas.getContext('2d'); outCtx.drawImage(b.image, 0, 0);

                // 使用画线作为橡皮擦，物理切开像素
                outCtx.globalCompositeOperation = 'destination-out';
                outCtx.beginPath();
                outCtx.moveTo(points[0][0] - bGlobalX, points[0][1] - bGlobalY);
                for(let k=1; k<points.length; k++) outCtx.lineTo(points[k][0] - bGlobalX, points[k][1] - bGlobalY);
                outCtx.lineWidth = 6; 
                outCtx.lineCap = 'round'; outCtx.lineJoin = 'round';
                outCtx.stroke();

                let outImgData = outCtx.getImageData(0, 0, b.width, b.height);
                let outHitData = new Uint8Array(b.width * b.height);
                let activeCount = 0, origCount = 0;
                
                for(let j=0; j<b.width*b.height; j++) { 
                    if (b.hitData[j]) origCount++;
                    if (outImgData.data[j*4+3] > 20) { outHitData[j] = 1; activeCount++; }
                }

                if (activeCount > 0 && activeCount < origCount) {
                    let blobs = extractBlobs(b.width, b.height, outHitData, 0);
                    if (blobs.length > 1 || activeCount < origCount) {
                        chunk.buildings.splice(i, 1);
                        blobs.forEach(blob => {
                            chunk.buildings.push(createBuildingFromBlob(blob, outImgData, b.width, b.height, b.islandType, b.localX, b.localY));
                        });
                        slicedCount++;
                    }
                }
            }
        }
        if (slicedCount > 0) setStatus(`〰️ 划线切割生效！实体已沿线条被物理一分为二，自动裂变为多个独立块。`);
    }

    // 下载边界参考图给AI
    function downloadEdgeForAI(gx, gy) {
        const leftN = chunks[`${gx - 1}_${gy}`], rightN = chunks[`${gx + 1}_${gy}`];
        const topN = chunks[`${gx}_${gy - 1}`], bottomN = chunks[`${gx}_${gy + 1}`];

        if ((!leftN || leftN.isPending) && (!rightN || rightN.isPending) && (!topN || topN.isPending) && (!bottomN || bottomN.isPending)) {
            return alert("请点击已有图片旁边的格子提取参考图！");
        }
        
        const edgeCanvas = document.createElement('canvas');
        edgeCanvas.width = edgeCanvas.height = CHUNK_SIZE;
        const eCtx = edgeCanvas.getContext('2d');
        
        if (leftN && !leftN.isPending) eCtx.drawImage(leftN.fullImage, CHUNK_SIZE - EDGE_WIDTH, 0, EDGE_WIDTH, CHUNK_SIZE, 0, 0, EDGE_WIDTH, CHUNK_SIZE);
        else if (rightN && !rightN.isPending) eCtx.drawImage(rightN.fullImage, 0, 0, EDGE_WIDTH, CHUNK_SIZE, CHUNK_SIZE - EDGE_WIDTH, 0, EDGE_WIDTH, CHUNK_SIZE);
        else if (topN && !topN.isPending) eCtx.drawImage(topN.fullImage, 0, CHUNK_SIZE - EDGE_WIDTH, CHUNK_SIZE, EDGE_WIDTH, 0, 0, CHUNK_SIZE, EDGE_WIDTH);
        else if (bottomN && !bottomN.isPending) eCtx.drawImage(bottomN.fullImage, 0, 0, CHUNK_SIZE, EDGE_WIDTH, 0, CHUNK_SIZE - EDGE_WIDTH, CHUNK_SIZE, EDGE_WIDTH);

        const dataURL = edgeCanvas.toDataURL('image/png');
        document.getElementById('debug-img').src = dataURL; document.getElementById('debug-img').style.display = 'block';
        
        const link = document.createElement('a'); link.download = `4K_Reference_${gx}_${gy}.png`; link.href = dataURL; link.click(); 
        
        chunks[`${gx}_${gy}`] = { isPending: true, baseX: gx * STRIDE, baseY: gy * STRIDE }; 
        updateUI(); draw();

        const txt = "移除所有地板，不管草地还是道路，只要能走的区域全部替换成同一种纯粹的纯色背景。保留完整的建筑主体，不要改动建筑内部样式。";
        fallbackCopy(txt);
        setTimeout(() => { prompt("边缘参考图已下载！\n【建筑层提取提示词】已优化并自动复制到剪贴板！\n如果没有复制成功，请手动复制下方内容发给AI：", txt); }, 100);
    }

    function setStatus(msg) { document.getElementById('status-bar').innerText = msg; }

    function setMode(newMode) {
        mode = newMode;
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.mode-btn[data-mode="${newMode}"]`).classList.add('active');
        currentPoly = []; isDrawingRect = false; isDrawingFreehand = false; freehandPts = [];
        hoveredPolygon = null; isHoveringDeleteBtn = false; canvas.style.cursor = 'crosshair';
        updateUI(); draw();
    }

    function updateUI() {
        updateAvailableSlots();
        const canAction = selectedChunkKey && !chunks[selectedChunkKey].isPending;
        document.getElementById('btn-replace').disabled = !canAction;
        document.getElementById('btn-add-buildings').disabled = !canAction;
        
        if (Object.keys(chunks).length === 0) setStatus("请先上传中心 4K 基础地图！");
        else if (mode === 'expand') setStatus(canAction ? `已选中 [${selectedChunkKey}] 区块` : `漫游模式：可抓取地图，点击虚线框十字提取扩图边缘`);
        else if (mode === 'cut') setStatus(`✂️ 切除(变红)：使用套索框选或【点选】孤岛，选中的区域会被精确变为红色丢弃区。`);
        else if (mode === 'merge') setStatus(`🔗 保留(变绿)：框住的红区会被同化，碰到绿岛会完整吸附！支持套索与【点选】。`);
        else setStatus(`物理区绘制：无视地图边界自由划定游戏逻辑区域。悬停已画区域中心可显示红点删除。`);
    }

    function getClickedObject(wx, wy) {
        for (let key in chunks) {
            const c = chunks[key];
            if (!c.isPending && wx >= c.drawX && wx <= c.drawX + c.cropW && wy >= c.drawY && wy <= c.drawY + c.cropH) return { type: 'chunk', key: key };
        }
        for (let key in chunks) {
            const c = chunks[key];
            if (c.isPending && wx >= c.baseX && wx <= c.baseX + CHUNK_SIZE && wy >= c.baseY && wy <= c.baseY + CHUNK_SIZE) return { type: 'pending', key: key };
        }
        for (let key in availableSlots) {
            const s = availableSlots[key];
            if (wx >= s.gx * STRIDE && wx <= s.gx * STRIDE + CHUNK_SIZE && wy >= s.gy * STRIDE && wy <= s.gy * STRIDE + CHUNK_SIZE) return { type: 'slot', key: key };
        }
        return null;
    }

    // ==============================
    // 鼠标输入检测与分发
    // ==============================
    canvas.addEventListener('mousedown', (e) => {
        if (e.button === 2) { isDragging = true; lastX = e.clientX; lastY = e.clientY; return; }
        if (e.button === 0) { 
            // 避开全新多排工具栏的区域高度，防误触
            if (e.clientY < 110) return; 
            const worldPos = getWorldPos(e.clientX, e.clientY);

            if (mode !== 'expand' && mode !== 'cut' && mode !== 'merge' && hoveredPolygon) {
                let c = hoveredPolygon.centroid;
                if (Math.hypot(worldPos.x - c.x, worldPos.y - c.y) < 20 / scale) {
                    globalShapes[hoveredPolygon.type].splice(hoveredPolygon.index, 1);
                    hoveredPolygon = null; isHoveringDeleteBtn = false; canvas.style.cursor = 'crosshair'; draw(); return; 
                }
            }
            if (Object.keys(chunks).length === 0) return alert("请先上传基础 4K 图像！");

            if (mode === 'expand') {
                const clicked = getClickedObject(worldPos.x, worldPos.y);
                if (clicked) {
                    if (clicked.type === 'chunk') { selectedChunkKey = clicked.key; updateUI(); }
                    else if (clicked.type === 'pending') { targetUploadChunk = clicked.key; document.getElementById('upload-chunk-img').click(); }
                    else if (clicked.type === 'slot') { const [gx, gy] = clicked.key.split('_').map(Number); downloadEdgeForAI(gx, gy); }
                }
            } else {
                if (shapeTool === 'click') {
                    if (['cut', 'merge'].includes(mode)) {
                        let clickedB = null;
                        for (let key in chunks) {
                            const chunk = chunks[key];
                            if (chunk.isPending || !chunk.buildings) continue;
                            for (let i = chunk.buildings.length - 1; i >= 0; i--) {
                                const b = chunk.buildings[i];
                                const globalBX = chunk.drawX + b.localX, globalBY = chunk.drawY + b.localY;
                                if (worldPos.x >= globalBX && worldPos.x < globalBX + b.width && 
                                    worldPos.y >= globalBY && worldPos.y < globalBY + b.height) {
                                    const lx = Math.floor(worldPos.x - globalBX);
                                    const ly = Math.floor(worldPos.y - globalBY);
                                    if (lx >= 0 && lx < b.width && ly >= 0 && ly < b.height) {
                                        if (b.hitData && b.hitData[ly * b.width + lx]) { clickedB = b; break; }
                                    }
                                }
                            }
                            if (clickedB) break;
                        }
                        
                        if (clickedB) {
                            let targetType = mode === 'cut' ? 'discard' : 'keep';
                            if (clickedB.islandType !== targetType) {
                                const outlineCanvas = document.createElement('canvas'); 
                                outlineCanvas.width = clickedB.width; outlineCanvas.height = clickedB.height;
                                const oCtx = outlineCanvas.getContext('2d'); 
                                oCtx.drawImage(clickedB.image, 0, 0);
                                oCtx.globalCompositeOperation = 'source-in'; 
                                oCtx.fillStyle = targetType === 'discard' ? 'rgba(255, 0, 0, 0.9)' : 'rgba(0, 255, 0, 0.9)'; 
                                oCtx.fillRect(0, 0, clickedB.width, clickedB.height);
                                
                                clickedB.outlineImage.onload = () => { draw(); };
                                clickedB.outlineDataURL = outlineCanvas.toDataURL('image/png');
                                clickedB.outlineImage.src = clickedB.outlineDataURL;
                                clickedB.islandType = targetType;
                                
                                setStatus(targetType === 'discard' ? "✂️ 点击生效！该孤岛已标记为【红色剔除】" : "🔗 点击生效！该孤岛已标记为【绿色保留】");
                            }
                        }
                    }
                } else if (shapeTool === 'poly') {
                    if (currentPoly.length > 0 && Math.hypot(worldPos.x - currentPoly[0][0], worldPos.y - currentPoly[0][1]) < 30 / scale) {
                        let pts = [...currentPoly];
                        currentPoly = []; 
                        
                        if (['col', 'occ', 'fg'].includes(mode)) globalShapes[mode].push(pts);
                        else if (mode === 'cut') executeAreaOperation(pts, 'discard'); 
                        else if (mode === 'merge') executeAreaOperation(pts, 'keep');
                        
                        draw(); return; 
                    }
                    currentPoly.push([worldPos.x, worldPos.y]);
                } else if (shapeTool === 'rect') {
                    isDrawingRect = true; rectStart = [worldPos.x, worldPos.y]; rectCurrent = [worldPos.x, worldPos.y];
                } else if (shapeTool === 'freeline') {
                    isDrawingFreehand = true; freehandPts = [[worldPos.x, worldPos.y]];
                }
            }
            draw();
        }
    });

    canvas.addEventListener('mousemove', (e) => {
        if (isDragging) { cameraX += (e.clientX - lastX); cameraY += (e.clientY - lastY); lastX = e.clientX; lastY = e.clientY; } 
        else { 
            mouseWorldPos = getWorldPos(e.clientX, e.clientY); 
            if (isDrawingRect) rectCurrent = [mouseWorldPos.x, mouseWorldPos.y]; 
            if (isDrawingFreehand) freehandPts.push([mouseWorldPos.x, mouseWorldPos.y]); 

            hoveredBuilding = null;
            for (let key in chunks) {
                const chunk = chunks[key];
                if (chunk.isPending || !chunk.buildings) continue;
                for (let i = chunk.buildings.length - 1; i >= 0; i--) {
                    const b = chunk.buildings[i];
                    const globalBX = chunk.drawX + b.localX, globalBY = chunk.drawY + b.localY;
                    if (mouseWorldPos.x >= globalBX && mouseWorldPos.x < globalBX + b.width && 
                        mouseWorldPos.y >= globalBY && mouseWorldPos.y < globalBY + b.height) {
                        const lx = Math.floor(mouseWorldPos.x - globalBX);
                        const ly = Math.floor(mouseWorldPos.y - globalBY);
                        if (lx >= 0 && lx < b.width && ly >= 0 && ly < b.height) {
                            if (b.hitData && b.hitData[ly * b.width + lx]) { hoveredBuilding = { ...b, globalX: globalBX, globalY: globalBY }; break; }
                        }
                    }
                }
                if (hoveredBuilding) break;
            }

            isHoveringDeleteBtn = false; hoveredPolygon = null;
            if (['col', 'occ', 'fg'].includes(mode) && currentPoly.length === 0 && !isDrawingRect && !isDrawingFreehand) {
                for (let type of ['fg', 'occ', 'col']) {
                    for (let i = globalShapes[type].length - 1; i >= 0; i--) {
                        const pts = globalShapes[type][i]; if(pts.length < 3) continue;
                        ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.translate(cameraX, cameraY); ctx.scale(scale, scale);
                        ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for(let j=1; j<pts.length; j++) ctx.lineTo(pts[j][0], pts[j][1]); ctx.closePath();
                        let isHit = ctx.isPointInPath(e.clientX, e.clientY); ctx.restore();

                        if (isHit) {
                            const centroid = getPolygonCentroid(pts); hoveredPolygon = { type, index: i, centroid };
                            if (Math.hypot(mouseWorldPos.x - centroid.x, mouseWorldPos.y - centroid.y) < 20 / scale) isHoveringDeleteBtn = true; break;
                        }
                    }
                    if (hoveredPolygon) break;
                }
            }

            // 更新点选鼠标样式
            let cursorStyle = 'crosshair';
            if (isHoveringDeleteBtn) cursorStyle = 'pointer';
            else if (shapeTool === 'click' && ['cut', 'merge'].includes(mode) && hoveredBuilding) cursorStyle = 'pointer';
            canvas.style.cursor = cursorStyle;
        }
        draw(); 
    });

    window.addEventListener('mouseup', (e) => { 
        if (e.button === 2) isDragging = false; 
        else if (e.button === 0) {
            if (mode !== 'expand') {
                if (shapeTool === 'rect' && isDrawingRect) {
                    if (Math.abs(rectCurrent[0] - rectStart[0]) > 5 && Math.abs(rectCurrent[1] - rectStart[1]) > 5) {
                        let pts = [
                            [rectStart[0], rectStart[1]], [rectCurrent[0], rectStart[1]], 
                            [rectCurrent[0], rectCurrent[1]], [rectStart[0], rectCurrent[1]]
                        ];
                        if (['col', 'occ', 'fg'].includes(mode)) globalShapes[mode].push(pts);
                        else if (mode === 'cut') executeAreaOperation(pts, 'discard'); 
                        else if (mode === 'merge') executeAreaOperation(pts, 'keep');
                    }
                    isDrawingRect = false; draw();
                } else if (shapeTool === 'freeline' && isDrawingFreehand) {
                    if (freehandPts.length > 2) {
                        if (['col', 'occ', 'fg'].includes(mode)) globalShapes[mode].push(freehandPts); 
                        else if (mode === 'cut' || mode === 'merge') executeLineCut(freehandPts); 
                    }
                    isDrawingFreehand = false; draw();
                }
            }
        }
    });
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    async function exportGodotZip() {
        if (Object.keys(chunks).length === 0) return alert("地图是空的！");
        const zip = new JSZip();
        
        const exportJSON = { map_version: "FINAL_PERFECT", chunks: [], global_polygons: globalShapes };
        const imagesFolder = zip.folder("images");

        for (let key in chunks) {
            const chunk = chunks[key];
            if (chunk.isPending) continue; 
            const [gx, gy] = key.split('_').map(Number);
            const imgName = `chunk_${gx}_${gy}_bg.jpg`; 

            imagesFolder.file(imgName, chunk.dataURL.split(',')[1], {base64: true});
            
            let chunkExportData = { 
                chunk_id: key, grid_x: gx, grid_y: gy, 
                background_path: "images/" + imgName, 
                global_position: { x: chunk.drawX, y: chunk.drawY }, 
                buildings: [] 
            };

            if (chunk.buildings && chunk.buildings.length > 0) {
                chunk.buildings.forEach((b, bIdx) => {
                    const bName = `chunk_${gx}_${gy}_building_${bIdx}.png`;
                    imagesFolder.file(bName, b.dataURL.split(',')[1], {base64: true});
                    
                    chunkExportData.buildings.push({ 
                        image_path: "images/" + bName, 
                        local_x: b.localX, 
                        local_y: b.localY,
                        global_x: chunk.drawX + b.localX,
                        global_y: chunk.drawY + b.localY,
                        width: b.width,
                        height: b.height,
                        island_type: b.islandType || 'keep' 
                    });
                });
            }
            exportJSON.chunks.push(chunkExportData);
        }
        
        zip.file("map_data.json", JSON.stringify(exportJSON, null, 2));
        setStatus("正在打包图像及碰撞数据，请稍候...");
        const blob = await zip.generateAsync({type: "blob"});
        const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = "Godot_Perfect_Map.zip"; link.click();
        URL.revokeObjectURL(link.href); setStatus("导出成功！JSON中已包含所有独立透明PNG及世界绝对坐标！");
    }

    function draw() {
        ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.translate(cameraX, cameraY); ctx.scale(scale, scale);
        
        const startX = -cameraX / scale, endX = startX + (canvas.width / scale);
        const startY = -cameraY / scale, endY = startY + (canvas.height / scale);

        for (let key in chunks) {
            const chunk = chunks[key];
            if (chunk.isPending) {
                if (chunk.baseX + CHUNK_SIZE < startX || chunk.baseX > endX || chunk.baseY + CHUNK_SIZE < startY || chunk.baseY > endY) continue;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.05)'; ctx.fillRect(chunk.baseX, chunk.baseY, CHUNK_SIZE, CHUNK_SIZE);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; ctx.lineWidth = 4 / scale; ctx.setLineDash([20/scale, 20/scale]);
                ctx.strokeRect(chunk.baseX + 10, chunk.baseY + 10, CHUNK_SIZE - 20, CHUNK_SIZE - 20); ctx.setLineDash([]);
                ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = `120px sans-serif`; ctx.textAlign = 'center';
                ctx.fillText("⏳ 点击上传 AI 扩图", chunk.baseX + CHUNK_SIZE/2, chunk.baseY + CHUNK_SIZE/2); ctx.textAlign = 'left';
            } else {
                if (chunk.drawX + chunk.cropW < startX || chunk.drawX > endX || chunk.drawY + chunk.cropH < startY || chunk.drawY > endY) continue;
                ctx.drawImage(chunk.croppedImage, chunk.drawX, chunk.drawY, chunk.cropW, chunk.cropH);
                if (chunk.buildings) chunk.buildings.forEach(b => { 
                    if (b.image.complete) {
                        ctx.drawImage(b.image, chunk.drawX + b.localX, chunk.drawY + b.localY, b.width, b.height); 
                    }
                });
                
                if (mode === 'expand' && key === selectedChunkKey) {
                    ctx.strokeStyle = 'rgba(0, 255, 204, 0.6)'; ctx.lineWidth = 4 / scale; ctx.setLineDash([15/scale, 15/scale]);
                    ctx.strokeRect(chunk.drawX, chunk.drawY, chunk.cropW, chunk.cropH); ctx.setLineDash([]);
                }
            }
        }

        if (mode === 'expand') {
            for (let key in availableSlots) {
                const s = availableSlots[key];
                const bx = s.gx * STRIDE, by = s.gy * STRIDE;
                if (bx + CHUNK_SIZE < startX || bx > endX || by + CHUNK_SIZE < startY || by > endY) continue;
                ctx.strokeStyle = 'rgba(0, 255, 204, 0.2)'; ctx.lineWidth = 4 / scale; ctx.setLineDash([20/scale, 20/scale]);
                ctx.strokeRect(bx, by, CHUNK_SIZE, CHUNK_SIZE); ctx.setLineDash([]);
                ctx.fillStyle = 'rgba(0, 255, 204, 0.5)'; ctx.font = `150px sans-serif`; ctx.textAlign = 'center';
                ctx.fillText("➕ 提取边缘", bx + CHUNK_SIZE/2, by + CHUNK_SIZE/2); ctx.textAlign = 'left';
            }
        }

        if (hoveredBuilding && hoveredBuilding.outlineImage && hoveredBuilding.outlineImage.complete && hoveredBuilding.image.complete) {
            const hx = hoveredBuilding.globalX, hy = hoveredBuilding.globalY, hw = hoveredBuilding.width, hh = hoveredBuilding.height;
            const lw = Math.min(8, 4 / scale); 
            ctx.drawImage(hoveredBuilding.outlineImage, hx - lw, hy, hw, hh);
            ctx.drawImage(hoveredBuilding.outlineImage, hx + lw, hy, hw, hh);
            ctx.drawImage(hoveredBuilding.outlineImage, hx, hy - lw, hw, hh);
            ctx.drawImage(hoveredBuilding.outlineImage, hx, hy + lw, hw, hh);
            ctx.globalAlpha = 0.2; ctx.drawImage(hoveredBuilding.outlineImage, hx, hy, hw, hh); ctx.globalAlpha = 1.0;
            ctx.drawImage(hoveredBuilding.image, hx, hy, hw, hh);
        }

        drawPolygons(globalShapes.col, colors['col'].fill, colors['col'].stroke);
        drawPolygons(globalShapes.occ, colors['occ'].fill, colors['occ'].stroke);
        drawPolygons(globalShapes.fg, colors['fg'].fill, colors['fg'].stroke);

        if (hoveredPolygon && ['col', 'occ', 'fg'].includes(mode)) {
            const c = hoveredPolygon.centroid, r = 20 / scale;
            const pts = globalShapes[hoveredPolygon.type][hoveredPolygon.index];
            ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
            for(let j=1; j<pts.length; j++) ctx.lineTo(pts[j][0], pts[j][1]);
            ctx.closePath(); ctx.fillStyle = 'rgba(255, 255, 255, 0.25)'; ctx.fill();
            ctx.strokeStyle = 'white'; ctx.lineWidth = 4 / scale; ctx.setLineDash([10/scale, 10/scale]); ctx.stroke(); ctx.setLineDash([]);
            ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, Math.PI * 2); ctx.fillStyle = isHoveringDeleteBtn ? 'rgba(255, 50, 50, 1)' : 'rgba(255, 50, 50, 0.7)'; ctx.fill();
            ctx.strokeStyle = 'white'; ctx.lineWidth = 4 / scale; ctx.lineCap = 'round'; ctx.beginPath();
            const hr = r * 0.4; ctx.moveTo(c.x - hr, c.y - hr); ctx.lineTo(c.x + hr, c.y + hr); ctx.moveTo(c.x + hr, c.y - hr); ctx.lineTo(c.x - hr, c.y + hr); ctx.stroke(); ctx.lineCap = 'butt';
        }

        if (mode !== 'expand') {
            const activeColor = colors[mode] ? colors[mode].stroke : 'white';
            const activeFill = colors[mode] ? colors[mode].fill : 'rgba(255,255,255,0.3)';
            
            if (shapeTool === 'poly' && currentPoly.length > 0) {
                ctx.beginPath(); ctx.moveTo(currentPoly[0][0], currentPoly[0][1]);
                for (let i = 1; i < currentPoly.length; i++) ctx.lineTo(currentPoly[i][0], currentPoly[i][1]);
                ctx.lineTo(mouseWorldPos.x, mouseWorldPos.y);
                ctx.strokeStyle = activeColor; ctx.lineWidth = 4 / scale; ctx.setLineDash([15/scale, 15/scale]); ctx.stroke(); ctx.setLineDash([]);
                
                ctx.fillStyle = activeFill;
                ctx.fill();

                ctx.fillStyle = activeColor; currentPoly.forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], 8 / scale, 0, Math.PI*2); ctx.fill(); });
                if (Math.hypot(mouseWorldPos.x - currentPoly[0][0], mouseWorldPos.y - currentPoly[0][1]) < 30 / scale) {
                    ctx.beginPath(); ctx.arc(currentPoly[0][0], currentPoly[0][1], 20 / scale, 0, Math.PI*2); ctx.strokeStyle = 'white'; ctx.lineWidth = 3 / scale; ctx.stroke();
                }
            } else if (shapeTool === 'rect' && isDrawingRect && rectStart && rectCurrent) {
                ctx.strokeStyle = activeColor; ctx.lineWidth = 4 / scale;
                ctx.fillStyle = activeFill;
                let rw = rectCurrent[0] - rectStart[0];
                let rh = rectCurrent[1] - rectStart[1];
                ctx.fillRect(rectStart[0], rectStart[1], rw, rh);
                ctx.strokeRect(rectStart[0], rectStart[1], rw, rh);
            } else if (shapeTool === 'freeline' && isDrawingFreehand && freehandPts.length > 0) {
                ctx.strokeStyle = activeColor; ctx.lineWidth = 4 / scale;
                ctx.beginPath(); ctx.moveTo(freehandPts[0][0], freehandPts[0][1]);
                for (let i = 1; i < freehandPts.length; i++) ctx.lineTo(freehandPts[i][0], freehandPts[i][1]);
                ctx.stroke();
            }
        }
    }

    function drawPolygons(polyArray, fillColor, strokeColor) {
        polyArray.forEach(pts => {
            if (pts.length < 3) return;
            ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
            for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
            ctx.closePath(); ctx.fillStyle = fillColor; ctx.fill(); ctx.strokeStyle = strokeColor; ctx.lineWidth = 4 / scale; ctx.stroke();
        });
    }

    draw(); 
</script>
